<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1430" viewBox="0 0 2220 1430" role="img" aria-labelledby="title description">
  <title id="title">CIPLEK Control Tower architecture</title>
  <desc id="description">Frontend-only synthetic React application with local simulation, bundled data and browser preferences. GitHub Actions validates pull requests and builds, provisions and deploys a checked static bundle to Azure Static Web Apps on main, then verifies the live deployment. Deployment configuration is not evidence of live Azure resources.</desc>
  <defs>
    <marker id="arrow-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#107C10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5C2D91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text id="drawing-title" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="32" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="40" y="20">CIPLEK Control Tower | Architecture</tspan></text>
  <text id="subtitle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="20" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="40" y="100">Frontend-only synthetic demo | No backend, database, runtime API or authentication</tspan></text>
  <rect id="browser" x="40" y="500" width="1040" height="780" rx="12" fill="none" stroke="#0078D4" stroke-width="2"/>
  <rect id="pipeline" x="1180" y="240" width="940" height="1040" rx="12" fill="none" stroke="#495057" stroke-width="2"/>
  <text id="runtime-heading" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="40" y="180">01  STATIC DELIVERY + BROWSER RUNTIME</tspan></text>
  <text id="browser-heading" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="65" y="520">User&apos;s browser | React 19 + TypeScript SPA</tspan></text>
  <text id="delivery-heading" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="1180" y="180">02  GITHUB ACTIONS | BUILD + PROVISION + DEPLOY</tspan></text>
  <rect id="host" x="100" y="260" width="900" height="140" rx="12" fill="none" stroke="#0078D4" stroke-width="2"/>
  <text id="host-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="120" y="280">Azure Static Web Apps | Free tier</tspan><tspan x="120" y="306.25">HTML / JS / CSS + bundled assets</tspan><tspan x="120" y="332.5">Managed HTTPS | SPA fallback | security headers</tspan></text>
  <rect id="app" x="90" y="630" width="400" height="160" rx="12" fill="none" stroke="#0078D4" stroke-width="2"/>
  <text id="app-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="20" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="110" y="650">App.tsx | Orchestration</tspan><tspan x="110" y="675">React state + memoized results</tspan><tspan x="110" y="700">Filters + scenario selection</tspan></text>
  <rect id="domain" x="640" y="630" width="390" height="160" rx="12" fill="none" stroke="#107C10" stroke-width="2"/>
  <text id="domain-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="20" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="660" y="650">Pure domain / simulation</tspan><tspan x="660" y="675">src/domain/supplyChain.ts</tspan><tspan x="660" y="700">Disruption -&gt; alternative -&gt; KPIs</tspan></text>
  <rect id="views" x="90" y="900" width="400" height="160" rx="12" fill="none" stroke="#0078D4" stroke-width="2"/>
  <text id="views-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="19" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="110" y="920">Dashboard views</tspan><tspan x="110" y="943.75">Overview | Shipments | Analytics</tspan><tspan x="110" y="967.5">Scenarios | Recharts | Tailwind</tspan><tspan x="110" y="991.25">Offline RouteMap + Lucide icons</tspan></text>
  <rect id="data" x="640" y="900" width="390" height="160" rx="12" fill="none" stroke="#107C10" stroke-width="2"/>
  <text id="data-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="19" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="660" y="920">Bundled local data</tspan><tspan x="660" y="943.75">24 synthetic shipments / 5 routes</tspan><tspan x="660" y="967.5">Scenario definitions</tspan><tspan x="660" y="991.25">Natural Earth map geometry</tspan></text>
  <rect id="prefs" x="90" y="1140" width="940" height="100" rx="12" fill="none" stroke="#5C2D91" stroke-width="2"/>
  <text id="prefs-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="20" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="110" y="1160">Browser preferences | localStorage</tspan><tspan x="110" y="1185">French / English (i18n.ts) + OS-aware light / dark theme</tspan></text>
  <rect id="repo" x="1220" y="280" width="860" height="110" rx="12" fill="none" stroke="#495057" stroke-width="2"/>
  <text id="repo-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="1240" y="300">frkim/CIPLEK-Control-Tower</tspan><tspan x="1240" y="326.25">Pull requests | main pushes | manual workflow runs</tspan></text>
  <rect id="build" x="1220" y="490" width="410" height="180" rx="12" fill="none" stroke="#F7630C" stroke-width="2"/>
  <text id="build-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="19" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="1240" y="510">Build job | Node 24</tspan><tspan x="1240" y="533.75">Protected npm feed + npm ci</tspan><tspan x="1240" y="557.5">Oxlint + domain tests</tspan><tspan x="1240" y="581.25">TypeScript + Vite -&gt; dist/</tspan></text>
  <rect id="infra" x="1690" y="490" width="390" height="180" rx="12" fill="none" stroke="#F7630C" stroke-width="2"/>
  <text id="infra-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="19" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="1710" y="510">Infrastructure job</tspan><tspan x="1710" y="533.75">infra/main.bicep</tspan><tspan x="1710" y="557.5">Bicep lint + build</tspan><tspan x="1710" y="581.25">Parallel to build job</tspan></text>
  <rect id="deploy" x="1220" y="800" width="860" height="200" rx="12" fill="none" stroke="#5C2D91" stroke-width="2"/>
  <text id="deploy-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="19" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="1240" y="820">Deploy job | main only | production environment</tspan><tspan x="1240" y="843.75">Requires BOTH jobs; serialized production deployments</tspan><tspan x="1240" y="867.5">Actions secret -&gt; Azure login -&gt; ARM validate / what-if / deploy</tspan><tspan x="1240" y="891.25">Masked runtime token -&gt; upload checked dist/ (no rebuild)</tspan></text>
  <rect id="verify" x="1220" y="1120" width="860" height="120" rx="12" fill="none" stroke="#107C10" stroke-width="2"/>
  <text id="verify-text" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="19" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="1240" y="1140">Post-deploy live verification</tspan><tspan x="1240" y="1163.75">Compare page + assets to artifact | headers + content types</tspan><tspan x="1240" y="1187.5">SPA fallback | missing-asset 404 | HTTP -&gt; HTTPS</tspan></text>
  <text id="footer" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="19" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="40" y="1340">Runtime: simulation, filtering, charts and CSV export execute locally. Reload resets simulation / filters; preferences persist when storage is available.</tspan><tspan x="40" y="1363.75">Deployment view reflects repository code, not verified live Azure resources. PRs validate only: no Azure credentials or deployment.</tspan></text>
  <polyline id="serve" points="290,410 60,410 60,605 290,605 290,620" fill="none" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-0)"/>
  <text id="serve-label" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="18" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="315" y="425">HTTPS: download static bundle, then execute locally</tspan></text>
  <polyline id="domain-flow" points="500,710 630,710" fill="none" stroke="#107C10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-1)" marker-end="url(#arrow-1)"/>
  <text id="domain-label" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="17" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="500" y="810">Scenario inputs / derived portfolio + metrics</tspan></text>
  <polyline id="view-flow" points="290,800 290,890" fill="none" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-0)"/>
  <polyline id="data-domain" points="835,890 835,800" fill="none" stroke="#107C10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
  <polyline id="data-map" points="630,980 500,980" fill="none" stroke="#107C10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
  <polyline id="prefs-app" points="80,1190 20,1190 20,740 80,740" fill="none" stroke="#5C2D91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-2)" marker-end="url(#arrow-2)"/>
  <polyline id="repo-build" points="1425,400 1425,480" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-3)"/>
  <polyline id="repo-infra" points="1885,400 1885,480" fill="none" stroke="#495057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-3)"/>
  <polyline id="build-deploy" points="1425,680 1425,790" fill="none" stroke="#5C2D91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2)"/>
  <polyline id="infra-deploy" points="1885,680 1885,790" fill="none" stroke="#5C2D91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2)"/>
  <text id="artifact-label" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="17" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="1240" y="705">Checked site artifact</tspan><tspan x="1240" y="726.25">(dist/)</tspan></text>
  <text id="infra-label" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="17" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="1905" y="705">Infrastructure</tspan><tspan x="1905" y="726.25">validation</tspan></text>
  <polyline id="deploy-verify" points="1650,1010 1650,1110" fill="none" stroke="#107C10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
  <polyline id="deploy-host" points="1210,900 1140,900 1140,330 1010,330" fill="none" stroke="#5C2D91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2)"/>
  <text id="deploy-label" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="17" dominant-baseline="text-before-edge" xml:space="preserve"><tspan x="1085" y="930">Publish</tspan></text>
</svg>
