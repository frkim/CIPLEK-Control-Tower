name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Test npm feed verification
        run: node --experimental-strip-types --test tests/npm-feed.test.ts
      - name: Verify npm feed
        run: node scripts/verify-npm-feed.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: az bicep lint --file infra/main.bicep
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    concurrency:
      group: azure-production
      cancel-in-progress: false
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/
      - name: Check Azure configuration
        run: |
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP Actions variable}"
          : "${AZURE_STATIC_WEB_APP_NAME:?Set the AZURE_STATIC_WEB_APP_NAME Actions variable}"
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Ensure resource group exists
        shell: bash
        run: |
          az account show --query '{subscription:name,subscriptionId:id}' --output table
          group_exists="$(az group exists --name "$AZURE_RESOURCE_GROUP" --output tsv)"
          case "$group_exists" in
            true) ;;
            false)
              az group create \
                --name "$AZURE_RESOURCE_GROUP" \
                --location "$AZURE_LOCATION" \
                --output none || {
                  echo "::error::Cannot create resource group '$AZURE_RESOURCE_GROUP'. Pre-create it in the subscription used by AZURE_CREDENTIALS and grant the deployment identity Contributor on that group, or use an identity already authorized to create resource groups."
                  exit 1
                }
              ;;
            *)
              echo "::error::Unexpected resource group existence result: '$group_exists'."
              exit 1
              ;;
          esac
      - name: Validate, preview, and deploy infrastructure
        run: |
          parameters=("siteName=$AZURE_STATIC_WEB_APP_NAME" "location=$AZURE_LOCATION")
          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep --parameters "${parameters[@]}" \
            --output none
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep --parameters "${parameters[@]}"
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep --parameters "${parameters[@]}" \
            --output none
      - name: Retrieve deployment token
        id: token
        run: |
          token="$(az staticwebapp secrets list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_STATIC_WEB_APP_NAME" \
            --query properties.apiKey --output tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"
      - name: Deploy checked production bundle
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify live application
        env:
          APP_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          node scripts/verify-live-deployment.mjs
          printf 'Deployed and verified: %s\n' "${APP_URL%/}" >> "$GITHUB_STEP_SUMMARY"
